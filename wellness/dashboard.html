  --cool: #2a78d6; --warm: #eb6834; --moved: #ffffff; --strip: #c7d3e1;
  /* Load ramp: more load, more contrast with the card - darker here. */
  --q0: #cfe0f4; --q1: #a3c6ec; --q2: #6fa3de; --q3: #3f7fcc; --q4: #1d589f;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --tonal: #2a78d6; --garmin: #eb6834; --withings: #1baf7a;
  --span: rgba(82,81,78,.10); --band: rgba(82,81,78,.13);
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --mus: #c7d3e1; --mus-ink: #0b0b0b; --bone: #a9a8a0; --fig-edge: rgba(11,11,11,.25);
  /* Body Scan region identity: a categorical palette, one hue per body part
     (torso orange, arms blue, legs teal). In a pair the lighter shade is the
     LEFT side, for arms and legs alike, so a pair reads apart in greyscale
     too. It is a different scale from the map's fat ramp (darker = more
     fat), which comes from the payload and stays inside the map. These are
     the dark theme's hues made darker, so the left side's lighter shades
     still clear 3:1 on the light card. --rg-ink-* is the text on each:
     4.5:1 or better. */
  --rg-whole: var(--ink); --rg-torso: #BD6614;
  --rg-arm_left: #4488D0; --rg-arm_right: #17559B; --rg-leg_left: #009B7C; --rg-leg_right: #006751;
  --rg-ink-whole: var(--page); --rg-ink-torso: var(--ink);
  --rg-ink-arm_left: var(--ink); --rg-ink-arm_right: var(--page);
  --rg-ink-leg_left: var(--ink); --rg-ink-leg_right: var(--page);
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Figures only, with tabular numerals so columns line up. Nothing is

    /* --muted is the floor for text under 12px; --dim is for 12px and up. */
    --ink: #EAF0F7; --ink2: #B9C8DA; --muted: #9DB0C7; --dim: #7E93AD;

    --cool: #74B4F0; --warm: #D6773E; --moved: #1A2740; --strip: #294363;
    /* Dark to light: more load, more contrast with the navy card. */
    --q0: #2F5C8C; --q1: #4276AE; --q2: #5E95CF; --q3: #8DBFF0; --q4: #C6E2FB;
    --grid: #1B2840; --axis: #294363; --border: rgba(234,240,247,.12);
    --tonal: #3987e5; --garmin: #d95926; --withings: #199e70;
    --span: rgba(157,176,199,.09); --band: rgba(157,176,199,.12);
    --mus: #2B4566; --mus-ink: #EAF0F7; --bone: #7E93AD; --fig-edge: transparent;

* { box-sizing: border-box; }

/* Header: date, the 14-night strip, sync health. */

.smed { stroke: var(--ink2); stroke-width: 1; opacity: .7; shape-rendering: crispEdges; }
.smedl { font: 9.5px var(--mono); fill: var(--muted); font-variant-numeric: tabular-nums; }

.st.ok { background: var(--good); } .st.warn { background: var(--warn); } .st.crit { background: var(--crit); }

/* Four equal pills. */
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 0; }

}

.win { display: flex; justify-content: flex-end; gap: 2px; margin: 10px 0 0; }
.win button { padding: 3px 9px; font: 12px var(--mono); }
.win button[aria-pressed="true"] { color: var(--ink); background: var(--raised); font-weight: 600; }

/* Cards: no borders, no shadows. */
.card { background: var(--card); border-radius: 12px; padding: 14px 15px; margin: 10px 0 0; }
.card h2, .ph h2, .pick label {
  font: 600 10px/1.3 var(--sans); text-transform: uppercase; letter-spacing: .13em;
  color: var(--muted); margin: 0 0 10px;
}

.rows .l { color: var(--ink2); }
.rows .v { font-weight: 600; text-align: right; white-space: nowrap; }
.rows .c { color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
.rows .c span { white-space: nowrap; }
.none { color: var(--ink2); margin: 0; }

/* What moved: the one section whose content changes day to day. */
.card.moved { background: var(--moved); border-left: 3px solid var(--warm); }
.mvl { margin: 0; padding: 0; list-style: none; }
.mvl li + li { margin-top: 8px; }

.mvl .l { font-weight: 600; }
.mvl .v { font-weight: 600; white-space: nowrap; }
.mvl .c { color: var(--ink2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
/* ...and when nothing moved, a quiet line in its place, not an empty card. */
.quiet { margin: 14px 2px 4px; color: var(--dim); }

/* Night readings as distance-from-median bars. */
.dr + .dr { margin-top: 11px; }
.dr .hd { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.dr .l { color: var(--ink2); }
.dr .v { font-weight: 600; white-space: nowrap; }
.dr .rt { display: flex; align-items: baseline; gap: 10px; }
.dr .med { font: 11px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.trk { position: relative; height: 6px; margin: 6px 7px 0; border-radius: 3px; background: var(--hair); }
.trk .bar { position: absolute; top: 0; height: 6px; border-radius: 3px; background: var(--cool); }
.trk .mid { position: absolute; left: 50%; top: -3px; width: 2px; height: 12px; margin-left: -1px; border-radius: 1px; background: var(--muted); }
/* Past the cap the bar stops at the track's end, squared off, with a chevron. */
.trk .bar.clip.r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.trk .bar.clip.l { border-top-left-radius: 0; border-bottom-left-radius: 0; }

  content: ""; position: absolute; top: -1px;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent;
}
.trk .bar.clip.r::after { right: -6px; border-left: 5px solid var(--cool); }
.trk .bar.clip.l::after { left: -6px; border-right: 5px solid var(--cool); }
.trk .pt { position: absolute; top: -1px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--cool); }
.nobar { font-size: 11px; color: var(--muted); margin: 3px 0 0; }
.card .cap { font-size: 9.5px; margin-top: 12px; }

/* Trends: lanes on one time axis, with a scrub line. */
.lanes { position: relative; padding-top: 26px; margin-top: 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; }
.lanes:focus-visible { outline: 2px solid var(--cool); outline-offset: 4px; border-radius: 4px; }
.chip {
  position: absolute; top: 0; left: 0; white-space: nowrap; pointer-events: none;
  font: 600 11px/1 var(--mono); color: var(--page); background: var(--ink);
  border-radius: 999px; padding: 5px 9px;
}
.lane + .lane { margin-top: 6px; }
.lh { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; }
.lnm { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
.rule { flex: 1 1 auto; height: 1px; background: var(--hair); min-width: 12px; }
.lv { font: 600 13px/1.2 var(--mono); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lanes .cross { stroke: var(--ink); }

/* Body Scan. Two colour scales, kept apart: the map shades each region off
   the fat ramp in the payload, and everywhere else a region is a series in
   its identity colour (--rg-<key>), through a rule per region (.rg-<key>). */
.bmap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
.fig { flex: none; overflow: visible; }
.fhead { fill: var(--axis); }
.rgn { cursor: pointer; outline: none; }

.rgn.sel rect { stroke: var(--ink); stroke-width: 2.5; }
.rgn:focus-visible rect { stroke: var(--cool); stroke-width: 2.5; }
.fside { fill: var(--muted); font: 600 10px var(--sans); }
.mside { flex: 1 1 170px; min-width: 0; max-width: 300px; }
.mlab { font: 600 10px/1.3 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; }
.rampbar { height: 10px; border-radius: 3px; }
.ramplab { display: flex; justify-content: space-between; gap: 6px; font: 10.5px var(--mono); color: var(--muted); margin: 3px 0 0; }
.mnote { font-size: 11.5px; color: var(--dim); margin: 4px 0 10px; }
.mwhole { margin: 0 0 6px; color: var(--ink2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.mwhole b { color: var(--ink); }
.msw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.msent { margin: 0; color: var(--ink); font-size: 13.5px; }
.cbars { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr) max-content max-content; gap: 6px 8px; align-items: center; margin: 16px 0 4px; }
.cbh { font: 600 9.5px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cbh:nth-child(2), .cbh:nth-child(4), .cbh:nth-child(5) { text-align: right; }
.cbars .nm { color: var(--ink2); font-size: 13px; white-space: nowrap; }
.cbars .nm.wh { color: var(--ink); font-weight: 600; }
.cbars .bn { font: 12px var(--mono); color: var(--ink2); text-align: right; }
.cbars .fp { font: 600 12.5px var(--mono); color: var(--ink); text-align: right; }
.cbars .ms { font: 600 12.5px var(--mono); color: var(--ink); text-align: right; }
.cbar { display: flex; gap: 2px; height: 20px; min-width: 0; }
.cbar span { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden;
  font: 600 11px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; border-radius: 3px; }
.cbar .mu { background: var(--mus); color: var(--mus-ink); }
.cbar .bo { background: var(--bone); }
.cbar.big { height: 28px; margin-top: 12px; }
.cbar.big span { font-size: 12.5px; }
.cbl { font: 12px var(--mono); color: var(--ink2); margin: 4px 0 0; }
.inwin { margin: 0; }
.slab { font: 600 11px var(--mono); fill: var(--ink); font-variant-numeric: tabular-nums; }
.slabn { font: 11px var(--sans); fill: var(--ink2); }
/* The whole body is dashed where it shares a chart with the segments. */
.ln.dash { stroke-dasharray: 6 4; }
.rank { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 5px 10px; align-items: center; margin: 6px 0 4px; }
.rank .nm { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.rtrk { position: relative; height: 14px; }
.rbar { position: absolute; top: 0; height: 14px; border-radius: 3px; }
.rzero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.rv { font: 600 12px var(--mono); color: var(--ink); text-align: right; white-space: nowrap; }
.ln.sp { stroke: var(--ink2); }
.sp:not(.ln) { fill: var(--ink2); }
.seg { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 0; }
.seg button { background: var(--raised); color: var(--ink2); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.hl { display: flex; flex-wrap: wrap; gap: 6px 34px; margin: 14px 0 0; }
.hl p { margin: 0; }
.hlab { font: 600 10px/1.3 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.hbig { font: 600 26px/1.2 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.chg { font: 12px var(--mono); color: var(--ink2); }
.dlab { font: 10.5px var(--sans); fill: var(--ink2); }
.dmel { font: 600 12px var(--mono); fill: var(--ink); }
.dme { stroke: var(--ink); stroke-width: 2; }
/* The side rule takes a line of its own under the region key. */
.lrule { flex-basis: 100%; color: var(--ink); }

/* Tonal: the machine's ceiling, and the quarterly load matrix. */
.capl { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; shape-rendering: crispEdges; }
.capt { fill: var(--muted); font-size: 10px; }
.mx { margin-top: 18px; }
.mxlg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink2); margin: 6px 0 2px; align-items: center; }
.mxlg span { display: inline-flex; align-items: center; gap: 6px; }
.mxlg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.ramp { gap: 2px !important; }
.mxlg i.qe { background: none; box-shadow: inset 0 0 0 1px var(--muted); }
.mxlg i.qn { background: radial-gradient(circle, var(--muted) 1.5px, transparent 2px); }
.q0 { fill: var(--q0); background: var(--q0); } .q1 { fill: var(--q1); background: var(--q1); }
.q2 { fill: var(--q2); background: var(--q2); } .q3 { fill: var(--q3); background: var(--q3); }
.q4 { fill: var(--q4); background: var(--q4); }
rect.qe { fill: none; stroke: var(--muted); stroke-width: 1; }
circle.qn { fill: var(--muted); }
.mxg { margin-top: 8px; }
/* Label and value on one line, the cells across the full width under them:
   at phone width that is the difference between 5px and 17px cells. */
.mxr {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "c c";
  gap: 3px 8px; align-items: baseline;
  width: 100%; padding: 6px 7px 7px; margin: 0; border-radius: 6px; text-align: left; color: var(--ink2);
}
.mxr .mxl { grid-area: l; } .mxr .mxv { grid-area: v; } .mxr .cells { grid-area: c; }
.mxr.mxy { padding-top: 0; padding-bottom: 0; grid-template-areas: "c c"; }
.mxr.mxy > span:not(.cells) { display: none; }
.mxr[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
.mxr .mxl { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mxr[aria-pressed="true"] .mxl { font-weight: 600; }
.mxr .cells { display: block; min-width: 0; }
.mxr .cells svg { display: block; overflow: visible; }
.mxv { display: flex; gap: 6px; align-items: baseline; }
.mxv .num { font: 600 13px var(--mono); color: var(--ink); }
.mxv .qd { font: 9px var(--mono); color: var(--muted); text-transform: uppercase; }

/* Trends and Tonal. */
.panel { padding-bottom: 8px; }
.ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
.desc { color: var(--ink2); font-size: 12.5px; margin: 3px 0 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; color: var(--ink2); margin: 2px 0 2px; }
.legend i, #tip i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.line, #tip i { width: 14px; height: 2px; border-radius: 1px; vertical-align: 3px; }
.ct { font-size: 12.5px; color: var(--ink2); margin: 10px 0 0; }
.ct b { color: var(--ink); font-weight: 600; }
.chart { width: 100%; }

svg { display: block; touch-action: pan-y; overflow: visible; }
svg text { font: 11px var(--sans); }
svg text.tick, svg text.endlab { font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.tick { fill: var(--muted); }
.grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ln.thin { stroke-width: 1.25; }
.ln.sess { stroke-width: 2.75; }
.brk { stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.brkgap { fill: var(--card); }
.tick.lo { fill: var(--ink); font-weight: 700; }
.ct .lo { color: var(--ink); font-weight: 600; }
.span { fill: var(--span); }
.band { fill: var(--band); }
.lane { fill: var(--ink2); }
.endlab { fill: var(--ink); font-weight: 600; }
.end, .hit { stroke: var(--card); stroke-width: 2; }
.cross { stroke: var(--ink2); stroke-width: 1; shape-rendering: crispEdges; }
.wash { opacity: .15; }
.bar:hover { opacity: .8; }

.ln.tonal { stroke: var(--tonal); } .ln.garmin { stroke: var(--garmin); } .ln.withings { stroke: var(--withings); }
.tonal:not(.ln) { fill: var(--tonal); } .garmin:not(.ln) { fill: var(--garmin); } .withings:not(.ln) { fill: var(--withings); }
i.tonal { background: var(--tonal); } i.garmin { background: var(--garmin); } i.withings { background: var(--withings); }
i.span { background: var(--span); outline: 1px solid var(--axis); outline-offset: -1px; }
.legend i.off { width: 0; height: 0; border-radius: 0; background: none !important;
  border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 7px solid; vertical-align: 0; }
.legend i.off.garmin { color: var(--garmin); } .legend i.off.withings { color: var(--withings); }
i.band { background: var(--band); }

#tip {
  position: fixed; z-index: 10; pointer-events: none; max-width: 280px;
  background: var(--card); color: var(--ink); border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(0,0,0,.14); border-radius: 8px; padding: 6px 9px; font-size: 12.5px;
}
#tip .tt { color: var(--ink2); margin-bottom: 2px; }
#tip b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
#tip span { color: var(--ink2); }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 4px; }
.pick label { margin: 0; }
select {
  font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 8px; min-width: 0; max-width: 100%; flex: 1 1 220px;
}
select:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
.mv { margin-top: 6px; }
.mv .ct { margin-top: 12px; }
.nowt { color: var(--ink2); font-size: 12.5px; margin: 12px 0 0; }
.nowt b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="date"></h1>
    <div id="strip"></div>
    <div id="health"></div>
    <div id="alerts"></div>
  </header>
  <nav class="tabs">
    <button type="button" data-view="today">Today</button>
    <button type="button" data-view="trends">Trends</button>
    <button type="button" data-view="tonal">Tonal</button>
    <button type="button" data-view="bodyscan">Body Scan</button>
  </nav>
  <div id="win" class="win" role="group" aria-label="Chart window" hidden></div>
  <main>
    <div id="view-today"></div>
    <div id="view-trends" hidden>
      <section class="card panel" id="p-lanes"></section>
    </div>
    <div id="view-tonal" hidden>
      <section class="card panel" id="p-tonal"></section>
    </div>
    <div id="view-bodyscan" hidden>
      <section class="card panel" id="p-map"></section>
      <section class="card panel" id="p-change"></section>
      <section class="card panel" id="p-compare"></section>
      <section class="card panel" id="p-detail"></section>
      <section class="card panel" id="p-balance"></section>
    </div>
  </main>
</div>
<div id="tip" role="tooltip" hidden></div>
<script id="data" type="application/json">__DASHBOARD_DATA__</script>
<script>
(function () {
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const NS = "http://www.w3.org/2000/svg";
const DAY = 86400000;
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MINUS = "−";

// ------------------------------------------------------------ formatting
// Days are integers (days since 1970-01-01) throughout; every date in the
// payload is already local to the configured timezone.
const dn = s => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / DAY);
const ud = n => new Date(n * DAY);
const fmtDay = n => { const d = ud(n); return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const fmtDate = n => { const d = ud(n); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const fmtMonth = n => { const d = ud(n); return `${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const fix = (v, dp) => v.toFixed(dp).replace("-", MINUS);
function signed(v, dp) {
  const r = Number(v.toFixed(dp));
  return r === 0 ? (0).toFixed(dp) : (r > 0 ? "+" : MINUS) + Math.abs(r).toFixed(dp);
}
const thou = v => Math.round(v).toLocaleString("en-US");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const monday = n => n - (ud(n).getUTCDay() + 6) % 7;
// Buckets of means start on a grid anchored at Monday 5 Jan 1970 (day 4),
// the grid dashboard.bucket_mean uses, so lanes bucketed alike line up.
const BUCKET_ANCHOR = 4;
const bucketStart = (n, step) => (step > 1 ? n - (((n - BUCKET_ANCHOR) % step) + step) % step : n);
function fmtRange(a, b) {
  const A = ud(a), same = A.getUTCFullYear() === ud(b).getUTCFullYear();
  return `${same ? `${A.getUTCDate()} ${MON[A.getUTCMonth()]}` : fmtDate(a)} – ${fmtDate(b)}`;
}
const compact = v => Math.abs(v) >= 1000 ? `${+(v / 1000).toFixed(1)}K` : `${+v.toFixed(2)}`.replace("-", MINUS);
function dur(sec) {
  const m = Math.round((sec || 0) / 60);
  return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} m` : `${m} m`;
}

// --------------------------------------------------------------- DOM
// Workout titles and annotation notes come from the sources: text only,
// never innerHTML.
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function sv(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem("wellness:" + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("wellness:" + k, v); } catch (e) { /* private mode */ } },
};

// A series is day-indexed (step 1) or week-indexed from a Monday (step 7).
// at(d) is the value of the bucket holding day d; count(d) is how many days
// a weekly mean was made of.
function series(o, step) {
  if (!o) return null;
  step = step || o.days || 1;
  const s0 = dn(o.start), v = o.values, i = d => Math.floor((d - s0) / step);
  return {
    s0, step, s1: s0 + step * v.length - 1,
    at: d => { const x = v[i(d)]; return x === undefined ? null : x; },
    count: d => (o.n && o.n[i(d)]) || 0,
  };
}
const SER = {}, WK = {};
for (const k in D.series) SER[k] = series(D.series[k]);
for (const k in D.weekly) WK[k] = series(D.weekly[k], 7);
// Every mass on the page is already in this unit: dashboard.py converts.
const MU = D.units.mass;
const TODAY = dn(D.built.today);
const SPANS = D.annotations.map(a => ({ ...a, a: dn(a.start), b: dn(a.end) }));

// ---------------------------------------------------------------- header
function renderHeader() {
  document.getElementById("date").textContent = `${fmtDay(TODAY)} ${ud(TODAY).getUTCFullYear()}`;
  renderStrip();
  const box = document.getElementById("health"), alertBox = document.getElementById("alerts");
  box.replaceChildren();
  alertBox.replaceChildren();
  const alerts = [];
  let viewerToday = null;
  try {
    viewerToday = new Intl.DateTimeFormat("en-CA", { timeZone: D.built.tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch (e) { /* unknown zone: skip the check */ }
  if (viewerToday && viewerToday !== D.built.today) {
    alerts.push(["warn", `Built ${D.built.local}. This is ${fmtDay(TODAY)}'s view, not today's.`]);
  }
  box.append(h("span", null, `synced ${D.health.synced_local || "never"}`));
  for (const s of D.health.sources) {
    const failed = s.last_status === "rejected" || s.last_status === "error";
    const item = h("span");
    item.append(h("i", "st " + (failed ? "crit" : s.stale ? "warn" : "ok")));
    item.append(`${s.source} ${s.newest ? fmtDay(dn(s.newest)).slice(4) : "no data"}`);
    box.append(item);
    if (s.stale) {
      alerts.push(["warn", s.newest
        ? `${s.source} is stale: newest data ${fmtDay(dn(s.newest))}, ${s.age_days} d old (limit ${s.limit_days} d).`
        : `${s.source} is stale: no data stored.`]);
    }
    if (failed) alerts.push(["crit", `${s.source}: last sync ${s.last_status}. Previous data kept.`]);
  }
  for (const [kind, text] of alerts) {
    const a = h("div");
    a.append(h("i", "st " + kind), text);
    alertBox.append(a);
  }
}

// Sleep on each of the last 14 nights, ending with the night that ended
// today. dashboard.sleep_strip picks the nights; this only draws them. A
// night with no record gets no bar at all: a gap, never a zero.
// The header's sleep strip. dashboard.sleep_strip decides every number: the
// hours, which night is Today's, the 30-day median, the range the bars run
// between (dashboard.strip_axis) and which nights fall below it. The bars
// start from a floor under the usual nights, not from zero, so a short night
// is visibly short. The median line is what makes them readable, and the
// payload only has a floor above zero when it has a median to draw. A night
// below the floor is a chevron at the bottom, never a bar cut to fit.
const SB = { w: 15, gap: 6, h: 34, dashGap: 4, dash: 3, lab: 60 };
function renderStrip() {
  const box = document.getElementById("strip");
  box.replaceChildren();
  const S = D.daily.strip;
  if (!S || !S.nights.length) return;
  const n = S.nights.length, BW = n * SB.w + (n - 1) * SB.gap, H = SB.h + SB.dashGap + SB.dash;
  const W = BW + (S.median_h != null ? SB.lab : 0);
  const rec = S.nights.filter(x => x.h != null).length, tr = S.nights.filter(x => x.trained).length;
  const low = S.nights.filter(x => x.below);
  const y = v => SB.h - (v - S.lo_h) / ((S.hi_h - S.lo_h) || 1) * SB.h;
  const svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `Sleep on the ${n} nights to ${fmtDay(dn(S.end))}: ${rec} recorded. ` +
      `The highlighted bar is the night the Today tab shows. ` +
      (S.median_h != null ? `A line marks your 30-day median, ${fix(S.median_h, 1)} h; the bars start at ${fix(S.lo_h, 1)} h, not 0. ` : "") +
      low.map(x => `${fmtDay(dn(x.day))}, ${fix(x.h, 1)} h, is below that and marked with a chevron. `).join("") +
      `A dash marks the night before a strength session: ${plural(tr, "night")}.` }, box);
  S.nights.forEach((x, i) => {
    const d = dn(x.day), x0 = i * (SB.w + SB.gap);
    const g = sv("g", {}, svg);
    // A dash marks a day with a strength session, under the night dated the
    // same day: Garmin dates a night by the morning it ended, so it is the
    // night BEFORE the session.
    sv("title", {}, g, `Night ending ${fmtDay(d)}: ${x.h == null ? "no sleep recorded" : fix(x.h, 1) + " h"}` +
      (x.below ? `, below the strip's ${fix(S.lo_h, 1)} h floor` : "") +
      (x.trained ? " · strength session later that day" : ""));
    if (x.below) {
      const cx = x0 + SB.w / 2;
      sv("path", { d: `M${cx - 4.5},${SB.h - 6}L${cx},${SB.h}L${cx + 4.5},${SB.h - 6}Z`,
                   class: "sbar low" + (x.day === S.latest ? " now" : "") }, g);
    } else if (x.h != null && S.hi_h != null) {
      const bh = Math.max(2, SB.h - y(x.h));
      sv("rect", { x: x0, y: SB.h - bh, width: SB.w, height: bh, rx: 3,
                   class: "sbar" + (x.day === S.latest ? " now" : "") }, g);
    }
    if (x.trained) sv("rect", { x: x0, y: SB.h + SB.dashGap, width: SB.w, height: SB.dash, rx: 1.5, class: "sdash" }, g);
    // An invisible full-height target, so a gap still answers on hover.
    sv("rect", { x: x0, y: 0, width: SB.w, height: H, fill: "transparent" }, g);
  });
  if (S.median_h != null) {
    // Over the bars, so a night that falls short of it is plainly short.
    const ym = Math.round(y(S.median_h)) + 0.5;
    sv("line", { x1: -3, x2: BW + 3, y1: ym, y2: ym, class: "smed" }, svg);
    sv("text", { x: BW + 7, y: ym, class: "smedl", "dominant-baseline": "middle" }, svg, `med ${fix(S.median_h, 1)} h`);
  }
  const cap = h("div", "cap");
  const l1 = h("p", null, `Sleep, last ${n} nights · `);
  l1.append(h("span", "tr", "▬"), " night before a strength session");
  const l2 = h("p");
  l2.append(h("span", "nw", "▮"), " highlighted: the night the Today tab shows");
  cap.append(l1, l2);
  const l3 = [S.median_h != null && "line: your 30-day median", low.length && "▾ shorter than the strip's floor"].filter(Boolean);
  if (l3.length) cap.append(h("p", null, l3.join(" · ")));
  box.append(cap);
}

// ----------------------------------------------------------------- today
const DP = { sleep_h: 1, sleep_score: 0, rhr: 0, bb_min: 0, bb_max: 0, weight: 1, fat: 1 };
const unitSuffix = u => (u ? (u === "%" ? " %" : ` ${u}`) : "");

function block(root, title, sub, cls) {
  const sec = h("section", "card" + (cls ? " " + cls : ""));
  const h2 = h("h2", null, title);
  if (sub) h2.append(h("span", "sub", ` · ${sub}`));
  sec.append(h2);
  root.append(sec);
  return sec;
}
function rows(sec) { const g = h("div", "rows"); sec.append(g); return g; }
// `cmp` is a string, or a list of phrases each kept on one line.
function row(g, label, value, cmp) {
  const c = h("span", "c");
  if (Array.isArray(cmp)) cmp.forEach((p, i) => c.append(i ? " · " : "", h("span", null, p)));
  else c.textContent = cmp || "";
  g.append(h("span", "l", label), h("span", "v", value), c);
}

function vsMedian(r) {
  if (r.value == null) return "no reading";
  if (r.median == null) return `no ${D.baseline_days}-day baseline`;
  const dp = DP[r.key];
  const delta = Number(r.value.toFixed(dp)) - Number(r.median.toFixed(dp));
  const unit = r.unit === "bpm" ? "" : unitSuffix(r.unit);
  if (Number(delta.toFixed(dp)) === 0) return `at median ${fix(r.median, dp)}`;
  return `${Math.abs(delta).toFixed(dp)}${unit} ${delta > 0 ? "above" : "below"} median ${fix(r.median, dp)}`;
}
function vsAverages(r) {
  if (r.value == null) return "no reading";
  const dp = DP[r.key];
  const part = (avg, n) => avg == null
    ? `${n}-d avg: too few readings`
    : `${signed(Number(r.value.toFixed(dp)) - Number(avg.toFixed(dp)), dp)} vs ${n}-d avg ${fix(avg, dp)}`;
  return [part(r.avg7, 7), part(r.avg30, 30)];
}
const reading = r => (r.value == null ? "—" : fix(r.value, DP[r.key]) + unitSuffix(r.unit));

// One night reading as a bar from its own 30-day median (the centre tick) to
// where it sits: left is below, right is above. Half the track is
// dashboard.DEV_CAP_SD of the metric's 30-day SDs, and r.dev.x is already
// that share, clipped to ±1. Past the cap the bar stops at the end of the
// track, squared off with a chevron, and its label says so; it is never
// drawn longer than the card. The words the bar replaces stay on as its
// accessible name.
// `own` names the row's day when it isn't the night's (see renderToday).
function devRow(sec, r, dayText, own) {
  const wrap = h("div", "dr");
  const hd = h("div", "hd"), right = h("span", "rt");
  // The median sits beside the figure, readable on a phone without hover.
  if (r.median != null) right.append(h("span", "med", `med ${fix(r.median, DP[r.key])}`));
  right.append(h("span", "v", reading(r)));
  hd.append(h("span", "l", own ? `${r.label} · ${own}` : r.label), right);
  wrap.append(hd);
  if (!r.dev) {
    wrap.append(h("p", "nobar", r.value == null ? "no reading" : `no ${D.baseline_days}-day baseline to compare with`));
  } else {
    const x = r.dev.x, trk = h("div", "trk");
    const words = `${r.label} ${reading(r)}, ${vsMedian(r)}` +
      (r.dev.clipped ? `, more than ${D.dev_cap_sd} SD out: the bar stops at the end` : "") + `. ${own || dayText}.`;
    trk.setAttribute("role", "img");
    trk.setAttribute("aria-label", words);
    trk.title = words;
    if (x !== 0) {
      const bar = h("span", "bar" + (r.dev.clipped ? " clip " + (x > 0 ? "r" : "l") : ""));
      bar.style.left = `${50 + Math.min(0, x) * 50}%`;
      bar.style.width = `${Math.abs(x) * 50}%`;
      trk.append(bar);
    }
    trk.append(h("span", "mid"));
    wrap.append(trk);
  }
  sec.append(wrap);
}
// Body battery is a range, not a deviation: low to high on a 0-100 track.
function batteryRow(sec, lo, hi, dayText, own) {
  const a = lo && lo.value, b = hi && hi.value;
  const wrap = h("div", "dr");
  const hd = h("div", "hd");
  hd.append(h("span", "l", own ? `Body battery · ${own}` : "Body battery"),
    h("span", "v", `${a == null ? "—" : fix(a, 0)}→${b == null ? "—" : fix(b, 0)}`));
  wrap.append(hd);
  if (a == null && b == null) { wrap.append(h("p", "nobar", "no reading")); sec.append(wrap); return; }
  const trk = h("div", "trk"), pct = v => `${Math.max(0, Math.min(100, v))}%`;
  const words = `Body battery ${a == null ? "low not recorded" : "low " + fix(a, 0)}, ` +
    `${b == null ? "high not recorded" : "high " + fix(b, 0)}, on a 0 to 100 scale. ${own || dayText}.`;
  trk.setAttribute("role", "img");
  trk.setAttribute("aria-label", words);
  trk.title = words;
  if (a != null && b != null) {
    const bar = h("span", "bar");
    bar.style.left = pct(Math.min(a, b));
    bar.style.width = `${Math.abs(b - a)}%`;
    trk.append(bar);
  } else {
    // Only one end recorded: a point there, not a range that guesses the other.
    const pt = h("span", "pt");
    pt.style.left = pct(a != null ? a : b);
    trk.append(pt);
  }
  wrap.append(trk);
  sec.append(wrap);
}

function renderMoved(root, v) {
  if (v.moved.length) {
    const mv = block(root, "What moved", `≥ ${D.moved_sd} SD from its own ${D.baseline_days}-day mean`, "moved");
    const ul = h("ul", "mvl");
    for (const x of v.moved) {
      const dp = DP[x.key] ?? 1;
      const li = h("li"), hd = h("div", "hd");
      hd.append(h("span", "l", x.label), h("span", "v", `${fix(x.value, dp)}${unitSuffix(x.unit)}`));
      li.append(hd, h("div", "c",
        `${Math.abs(x.z).toFixed(1)} SD ${x.z > 0 ? "above" : "below"} mean ${fix(x.mean, dp)}` +
        (x.day ? ` · ${fmtDay(dn(x.day))}` : "")));
      ul.append(li);
    }
    mv.append(ul);
    return;
  }
  // Nothing moved is the usual morning, so it gets one quiet line and the
  // page is shorter - not an empty card that looks like it failed to load.
  const q = h("div", "quiet"), line = h("p", "q");
  q.setAttribute("role", "status");
  const ic = sv("svg", { width: 14, height: 14, viewBox: "0 0 14 14", "aria-hidden": "true" });
  sv("circle", { cx: 7, cy: 7, r: 6, fill: "none", stroke: "currentColor", "stroke-width": 1.25 }, ic);
  sv("line", { x1: 4.25, x2: 9.75, y1: 7, y2: 7, stroke: "currentColor", "stroke-width": 1.25, "stroke-linecap": "round" }, ic);
  if (v.moved_checked) {
    line.append(ic, `Nothing moved beyond ${D.moved_sd} SD.`);
    q.append(line, h("p", "note",
      `${v.moved_checked === 1 ? "The 1 reading" : `All ${v.moved_checked} readings`} with a ${D.baseline_days}-day history ` +
      `${v.moved_checked === 1 ? "is" : "are"} within ${D.moved_sd} SD. That's most mornings: the check ran and found nothing.`));
  } else {
    // With no baseline, nothing could move: say so rather than "nothing moved".
    line.append(ic, "Nothing to compare yet.");
    q.append(line, h("p", "note", `No reading has enough ${D.baseline_days}-day history to test against, so nothing can be flagged.`));
  }
  root.append(q);
}

function renderToday() {
  const v = D.daily;
  const root = document.getElementById("view-today");
  root.replaceChildren();
  renderMoved(root, v);

  // Garmin dates a night by the morning it ended.
  const nd = v.night.day ? dn(v.night.day) : null;
  const night = block(root, nd === TODAY ? "Last night" : nd ? `Night ending ${fmtDay(nd)}` : "Last night",
    nd !== null && nd !== TODAY ? "Garmin · last night not synced yet" : "Garmin");
  if (nd === null) night.append(h("p", "none", "No Garmin data."));
  else {
    const by = Object.fromEntries(v.night.rows.map(r => [r.key, r]));
    const dayText = `Night ending ${fmtDay(nd)}`;
    // Resting HR and body battery read the whole day. On a morning the sleep
    // catch-up has loaded only the night, they are the day before's
    // (dashboard.night_row_days), and the row names that day.
    const own = r => r && r.day && r.day !== v.night.day ? fmtDay(dn(r.day)) : null;
    for (const k of ["sleep_h", "sleep_score", "rhr"]) if (by[k]) devRow(night, by[k], dayText, own(by[k]));
    batteryRow(night, by.bb_min, by.bb_max, dayText, own(by.bb_min) || own(by.bb_max));
    night.append(h("p", "cap", `Bar = distance from your own ${D.baseline_days}-day median`));
    if (v.night.rows.some(r => r.dev && r.dev.clipped)) {
      night.append(h("p", "cap", `▸ = more than ${D.dev_cap_sd} SD out; the bar stops at the end`));
    }
  }

  const t = v.training;
  const tsrc = [t.tonal.length && "Tonal", t.garmin.length && "Garmin"].filter(Boolean).join(" + ");
  const train = block(root, `Yesterday · ${fmtDay(dn(t.day))}`, tsrc || null);
  const g2 = rows(train);
  if (t.tonal.length) {
    const vols = t.tonal.map(w => w.volume).filter(x => x != null);
    const sets = t.tonal.reduce((a, w) => a + (w.sets || 0), 0);
    const mins = t.tonal.reduce((a, w) => a + (w.dur_s || 0), 0);
    row(g2, "Tonal", `${vols.length ? thou(vols.reduce((a, b) => a + b, 0)) + " " + MU : "volume —"} · ${sets} sets`,
      `${t.tonal.map(w => w.title || "untitled").join(", ")} · ${dur(mins)}`);
  }
  if (t.garmin.length) {
    row(g2, "Garmin", dur(t.garmin.reduce((a, w) => a + (w.dur_s || 0), 0)),
      t.tonal.length ? "strength, watch" : "strength, watch only: no volume recorded");
  }
  if (!t.tonal.length && !t.garmin.length) {
    row(g2, "No session", "", t.other.length
      ? "other: " + t.other.map(o => `${(o.sport || "activity").replace(/_/g, " ")} ${dur(o.dur_s)}`).join(", ")
      : "");
  }

  const m = v.morning;
  if (!m) block(root, "This morning", "Withings").append(h("p", "none", "No weigh-ins stored."));
  else {
    const md = dn(m.day);
    const sec = block(root, md === TODAY ? "This morning" : `Last weigh-in · ${fmtDay(md)}`,
      `${m.time ? m.time + " · " : ""}Withings${md === TODAY ? "" : " · none today"}`);

// ---------------------------------------------------------------- charts
function niceStep(raw, integer) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  return integer ? Math.max(1, Math.round(step)) : step;
}

function xTicks(d0, d1, pw) {
  const fit = Math.max(2, Math.floor(pw / 50));
  const gen = (kind, step) => {
    const out = [];
    if (kind === "w") {
      let d = d0 + ((8 - ud(d0).getUTCDay()) % 7);   // first Monday
      for (; d <= d1; d += step) out.push([d, `${ud(d).getUTCDate()} ${MON[ud(d).getUTCMonth()]}`]);
    } else {
      const a = ud(d0);
      let y = a.getUTCFullYear(), mo = a.getUTCMonth() + (a.getUTCDate() > 1 ? 1 : 0);
      for (;; mo++) {
        if (mo > 11) { mo = 0; y++; }
        const d = Date.UTC(y, mo, 1) / DAY;
        if (d > d1) break;
        if (kind === "m" && mo % step === 0) out.push([d, mo === 0 ? String(y) : MON[mo]]);
        if (kind === "y" && mo === 0 && y % step === 0) out.push([d, String(y)]);
      }
    }
    return out;
  };
  const opts = [["w", 7], ["w", 14], ["m", 1], ["m", 2], ["m", 3], ["m", 6], ["y", 1], ["y", 2], ["y", 5]];
  for (const [k, st] of opts) {
    const t = gen(k, st);
    if (t.length <= fit) return t;
  }
  return gen("y", 10);
}

const ML = 40, MR = 44;
const plotWidth = host => Math.max(260, Math.floor(host.clientWidth)) - ML - MR;

class Chart {
  // o: { d0, d1, height, lo, hi, integer, yFmt, lane, label,
  //      ml, mr, mt, mb: margins; ends: label only the two ends of y;
  //      noY: no y axis; xaxis: false for no x axis }
  constructor(host, o) {
    this.o = o;

    this.m = { l: o.ml ?? ML, r: o.mr ?? MR, t: o.mt ?? (o.lane ? 18 : 6),
               b: o.xaxis === false ? (o.mb ?? 4) : 20 };
    this.pw = W - this.m.l - this.m.r;
    this.n = o.d1 - o.d0 + 1;
    const H = o.height + this.m.t + this.m.b;
    this.svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.label || "", tabindex: 0 }, host);
    this.gBack = sv("g", {}, this.svg);
    this.gGrid = sv("g", {}, this.svg);
    this.gData = sv("g", {}, this.svg);
    this.gTop = sv("g", {}, this.svg);
    this.gCross = sv("g", {}, this.svg);
    this.lines = [];
    this.scaleY(o.lo, o.hi, o.integer);
    this.axes();
  }
  xl(d) { return this.m.l + (d - this.o.d0) / this.n * this.pw; }
  // Middle of the bucket [d, d + step) as far as it lies inside the window,
  // so a week cut by the window's edge is marked over the days shown.
  xb(d, step) { return this.xl((Math.max(d, this.o.d0) + Math.min(d + step, this.o.d1 + 1)) / 2); }
  // The first bucket of s that overlaps the window.
  first(s) { return s.s0 + s.step * Math.max(0, Math.floor((this.o.d0 - s.s0) / s.step)); }
  y(v) { return this.m.t + this.o.height - (v - this.lo) / (this.hi - this.lo) * this.o.height; }
  dayAt(px) {
    const d = this.o.d0 + Math.floor((px - this.m.l) / this.pw * this.n);
    return Math.max(this.o.d0, Math.min(this.o.d1, d));
  }
  scaleY(lo, hi, integer) {
    if (!(hi > lo)) { lo = (lo || 0) - 1; hi = (hi || 0) + 1; }
    if (this.o.ends) {
      // Lanes: the range as given, and only its two ends labelled.
      this.lo = lo;
      this.hi = hi;
      this.ticks = [lo, hi];
      return;
    }
    if (this.o.exact) {
      // The range as given, not rounded out to a step: the bottom is always
      // a labelled tick, and the round steps above it fill in the rest.
      const step = niceStep((hi - lo) / 3, integer);
      this.lo = lo;
      this.hi = hi;
      this.ticks = [lo];
      for (let v = Math.ceil((lo + 0.4 * step) / step) * step; v <= hi + 1e-9; v += step) this.ticks.push(Number(v.toFixed(6)));
      // And the top, unless a round tick already sits close below it.
      if (hi - this.ticks[this.ticks.length - 1] > 0.4 * step) this.ticks.push(hi);
      return;
    }
    const step = niceStep((hi - lo) / 3, integer);
    this.lo = Math.floor(lo / step + 1e-9) * step;
    this.hi = Math.ceil(hi / step - 1e-9) * step;

  axes() {
    const { m, pw } = this, fmt = this.o.yFmt || (v => String(v));

      const y = Math.round(this.y(t)) + 0.5;
      sv("line", { x1: m.l, x2: m.l + pw, y1: y, y2: y, class: t === 0 ? "base" : "grid" }, this.gGrid);
      this.tickText.push(sv("text", { x: m.l - 6, y, class: "tick", "text-anchor": "end", "dominant-baseline": "middle" }, this.gGrid, fmt(t)));
    }

    for (const [d, label] of xTicks(this.o.d0, this.o.d1, pw)) {
      const x = this.xl(d);

      sv("text", { x, y: yb + 15, class: "tick", "text-anchor": x > m.l + pw - 14 ? "end" : "middle" }, this.gGrid, label);

  }
  span(a, b, label) {
    const x0 = Math.max(this.m.l, this.xl(a)), x1 = Math.min(this.m.l + this.pw, this.xl(b + 1));
    if (x1 <= x0) return;
    sv("rect", { x: x0, y: this.m.t, width: x1 - x0, height: this.o.height, class: "span" }, this.gBack);
    if (!label || !this.o.lane) return;
    const t = sv("text", { x: x0, y: this.m.t - 6, class: "lane" }, this.gTop, label);
    const w = t.getComputedTextLength();
    const right = this.m.l + this.pw + this.m.r;
    if (x0 + w > right) {
      t.setAttribute("x", Math.max(2 + w, x1));
      t.setAttribute("text-anchor", "end");
    }
    sv("line", { x1: x0, x2: x0, y1: this.m.t - 4, y2: this.m.t, class: "base" }, this.gTop);
    sv("line", { x1: x1, x2: x1, y1: this.m.t - 4, y2: this.m.t, class: "base" }, this.gTop);
  }
  band(lo, hi) {
    sv("rect", { x: this.m.l, y: this.y(hi), width: this.pw, height: this.y(lo) - this.y(hi), class: "band" }, this.gBack);

  // A dashed line down the plot at day d.
  mark(d) {

    sv("line", { x1: x, x2: x, y1: this.m.t, y2: this.m.t + this.o.height, class: "capl" }, this.gTop);
  }
  washes(td) {

      const k = td.at(d);

  }

  // a dot. A missing one ends the run, so nothing is drawn across a gap.

  // run ends there and a chevron on the edge marks it, pointing the way it
  // went, so one reading can't stretch the scale and isn't hidden either.
  line(s, cls) {

    const st = s.step, thin = this.n / st > 400 ? " thin" : "";

      if (run.length === 1) sv("circle", { cx: run[0][0], cy: run[0][1], r: thin ? 1.5 : 2, class: cls }, this.gData);
      else if (run.length > 1) path += "M" + run.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("L");
      run = [];

                     class: "off " + cls }, this.gTop);

      run.push([this.xb(d, st), this.y(v)]);

      const v = s.at(d);
      if (v == null) continue;
      sv("circle", { cx: this.xb(d, st), cy: this.y(v), r: 4, class: "end " + cls }, this.gTop);
      sv("text", { x: this.m.l + this.pw + 7, y: this.y(v), class: "endlab", "dominant-baseline": "middle" }, this.gTop, fmt(v));

// One crosshair and one tooltip for every chart in a group, so the charts
// sharing an x axis are read together.
function linkCharts(charts, readout, opts) {
  const step = (opts && opts.step) || 1;
  const snap = d => (opts && opts.snap ? opts.snap(d) : d);
  const tip = document.getElementById("tip");
  let cur = null;
  const show = (d, cx, cy) => {
    cur = d;
    for (const c of charts) c.cross(d, step);
    const { title, items } = readout(d);
    tip.replaceChildren(h("div", "tt", title));
    for (const it of items) {
      const r = h("div");
      if (it.cls) r.append(h("i", it.cls));
      r.append(h("b", null, it.value), h("span", null, " " + it.label));
      tip.append(r);
    }
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = cx + 14, y = cy - th - 10;
    if (x + tw > window.innerWidth - 8) x = cx - tw - 14;
    if (x < 8) x = 8;
    if (y < 8) y = cy + 18;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  };
  const hide = () => { for (const c of charts) c.cross(null); tip.hidden = true; };
  for (const c of charts) {
    const at = e => { const r = c.svg.getBoundingClientRect(); show(snap(c.dayAt(e.clientX - r.left)), e.clientX, e.clientY); };
    c.svg.addEventListener("pointermove", at);
    c.svg.addEventListener("pointerdown", at);
    c.svg.addEventListener("pointerleave", hide);
    c.svg.addEventListener("blur", hide);
    c.svg.addEventListener("keydown", e => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      const dir = e.key === "ArrowLeft" ? -1 : 1;
      const d = cur == null ? snap(c.o.d1)
        : opts && opts.move ? opts.move(cur, dir)
        : Math.max(snap(c.o.d0), Math.min(snap(c.o.d1), cur + dir * step));
      const r = c.svg.getBoundingClientRect();
      show(d, r.left + c.xb(d, step), r.top + c.m.t);
    });
  }
}

function extent(list, d0, d1) {
  let lo = Infinity, hi = -Infinity;
  for (const s of list) {
    if (!s) continue;
    for (let d = Math.max(d0, s.s0); d <= Math.min(d1, s.s1); d++) {
      const v = s.at(d);
      if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; }
    }

}

// One window for the whole Trends view. A panel whose data starts later
// than the window draws from its own first day, and its heading says so.
const WINS = [["30d", 30], ["90d", 90], ["1y", 365], ["3y", 1095], ["All", null]];

const DAILY_TRAINING_BELOW = 90;

const WIN = {};
for (const [v, dflt] of [["trends", "90d"], ["tonal", "All"]]) {
  const k = store.get(WIN_KEY[v]);

function renderWindowControl(view) {

function laneHead(wrap, name) {
