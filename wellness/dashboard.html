  if (weekly) return plural(tonal + garmin, "session") + (vol != null ? ` · ${compact(vol)} ${MU}` : "");
  const parts = [];
  if (tonal) parts.push((tonal > 1 ? `${tonal} Tonal` : "Tonal") + (vol != null ? ` · ${thou(vol)} ${MU}` : ""));
  if (garmin) parts.push((garmin > 1 ? `${garmin}× ` : "") + "watch strength");
  return parts.join(" + ");
}

function renderLanes() {
  const panel = document.getElementById("p-lanes");
  panel.replaceChildren();
  const T = D.training;
  const axis = l => D.lanes[l.key] && D.lanes[l.key][WIN.trends];
  const lines = LANES.filter(l => SER[l.key] && axis(l));
  if (!lines.length && !T) { panelHead(panel, "Trends"); panel.append(h("p", "none", "Nothing stored yet.")); return; }
  const r = range(Math.min(...lines.map(l => SER[l.key].s0), T ? dn(T.daily.start) : Infinity));
  const { d0, d1 } = r;
  panelHead(panel, "Trends", r);
  const desc = h("p", "desc");
  panel.append(desc);
  const leg = [["tonal", "Tonal session"], ["garmin", "watch strength only"], ["span", "annotated: no data expected"]];
  const legBox = h("div");
  panel.append(legBox);
  const wrap = h("div", "lanes");
  panel.append(wrap);
  const weekly = (Math.max(260, wrap.clientWidth) - LML - LMR) / (d1 - d0 + 1) < MIN_PX_PER_DAY;
  const step = weekly ? 7 : 1;
  desc.textContent = "One time axis for every lane, so each session sits above the nights around it. " +
    "Sleep is dated by the morning it ended: the night after a session is the next day's. " +
    "Drag across the lanes, or tap, to read any day. " +
    "Each lane is scaled to the window shown, from its 2nd to 98th percentile with some room, so one odd reading can't flatten it. " +
    "Both ends are labelled because the scale changes with the window; one that doesn't start at zero has a break mark. " +
    (weekly ? "Too many days to mark each one, so the lines are weekly means, Monday to Sunday." : "A day without a value is a gap.");
  const chip = h("div", "chip");
  chip.setAttribute("aria-hidden", "true");
  wrap.append(chip);

  const lanes = [], offCls = new Set();
  if (T) {
    const { box, val } = laneHead(wrap, "Training");
    const c = new Chart(box, { d0, d1, height: 24, lo: 0, hi: 1, noY: true, xaxis: false,
      ml: LML, mr: LMR, mt: 2, mb: 2, label: "Strength sessions, one mark per session" });
    for (const a of spansFor(["tonal", "garmin"], d0, d1)) c.span(a.a, a.b, null);
    // One mark per session, stacked on a day with more than one.
    const B = T.daily, b0 = dn(B.start);
    const w = Math.max(1, Math.min(5, c.pw / c.n - 1));
    for (let d = Math.max(d0, b0); d <= Math.min(d1, b0 + B.tonal.length - 1); d++) {
      const i = d - b0, n = B.tonal[i] + B.garmin[i];
      if (!n) continue;
      const mh = n <= 2 ? 10 : (24 - (n - 1) * 2) / n, x = c.xb(d, 1) - w / 2;
      for (let k = 0; k < n; k++) {
        sv("rect", { x, y: c.m.t + 24 - k * (mh + 2) - mh, width: w, height: mh,
                     rx: Math.min(w / 2, 1.5), class: k < B.tonal[i] ? "tonal" : "garmin" }, c.gData);
      }
    }
    lanes.push({ name: "Training", c, val, read: d => trainingText(T, d, weekly), has: d => trainingText(T, d, false) !== "none" });
  }
  lines.forEach((l, i) => {
    const s = weekly ? WK[l.key] : SER[l.key], { lo, hi } = axis(l);
    const { box, val } = laneHead(wrap, l.name);
    const c = new Chart(box, { d0, d1, height: 56, lo, hi, ends: true, clip: true, xaxis: i === lines.length - 1,
      ml: LML, mr: LMR, mt: 6, mb: 4, yFmt: v => (Number.isInteger(v) ? String(v) : fix(v, 1)), label: `${l.name}${l.unit}` });
    for (const a of spansFor([l.src], d0, d1)) c.span(a.a, a.b, null);
    c.line(s, l.src);
    if (c.offScale) offCls.add(l.src);
    if (c.axisBreak()) c.svg.setAttribute("aria-label", `${l.name}${l.unit}, axis from ${lo} to ${hi}, not from 0`);
    lanes.push({ name: l.name, c, val, has: d => SER[l.key].at(d) != null,
      read: d => {
        const v = s ? s.at(d) : null;
        if (v == null) return annotated([l.src], d) ? "— annotated" : "—";
        return fix(v, l.dp) + l.unit + (v > hi ? " ▲ off scale" : v < lo ? " ▼ off scale" : "");
      } });
  });
  // The off-scale marker is explained only when one is drawn.
  for (const cls of offCls) leg.push([`off ${cls}`, "beyond the lane's scale: drawn on the edge, its value in the header"]);
  legend(legBox, leg);

  scrubLanes(wrap, chip, lanes, d0, d1, step, TREND_SCRUB);
}

// A scrub line through every lane in `wrap` at once, and the date chip above
// them. Dragging it (or tapping) moves it; each lane's header value is for
// the date in the chip. Touch: a sideways drag scrubs and a vertical one
// still scrolls the page (touch-action: pan-y), so a thumb resting on the
// lanes doesn't jump the line. The whole lane area is the target, not the
// 1px line. lanes: [{ name, c, val, read(d), has(d) }]; step is the days per
// mark (1, 7 or 28); state.d keeps the day across redraws, null the newest.
function scrubLanes(wrap, chip, lanes, d0, d1, step, state) {
  const ref = lanes[0].c, dLo = bucketStart(d0, step);
  const snap = d => Math.max(dLo, Math.min(d1, bucketStart(d, step)));
  const when = d => (step === 1 ? `${fmtDay(d)} ${ud(d).getUTCFullYear()}` : `${bucketTitle(d, step)} · ${meansName(step)}`);
  const set = d => {
    state.d = d;
    for (const L of lanes) { L.c.cross(d, step); L.val.textContent = L.read(d); }
    chip.textContent = when(d);
    wrap.setAttribute("aria-valuetext", `${when(d)}. ` + lanes.map(L => `${L.name}: ${L.read(d)}`).join(", "));
    const x = ref.xb(d, step), cw = chip.offsetWidth;
    chip.style.left = `${Math.max(0, Math.min(wrap.clientWidth - cw, x - cw / 2))}px`;
  };
  // The default is the newest day any lane has a value for.
  let newest = d1;
  while (newest > d0 && !lanes.some(L => L.has(newest))) newest--;
  set(state.d != null && state.d >= dLo && state.d <= d1 ? snap(state.d) : snap(newest));

  wrap.tabIndex = 0;
  wrap.setAttribute("role", "slider");
  wrap.setAttribute("aria-label", "Date shown in every lane. Arrow keys move it.");
  const at = e => { const b = ref.svg.getBoundingClientRect(); set(snap(ref.dayAt(e.clientX - b.left))); };
  let down = null;
  // Capture keeps the drag going when the finger leaves the lanes.
  const capture = e => { try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* already released */ } };
  wrap.addEventListener("pointerdown", e => {
    down = { x: e.clientX, drag: e.pointerType === "mouse" };
    if (down.drag) { capture(e); at(e); }
  });
  wrap.addEventListener("pointermove", e => {
    if (!down) return;
    if (!down.drag && Math.abs(e.clientX - down.x) > 6) { down.drag = true; capture(e); }
    if (down.drag) at(e);
  });
  wrap.addEventListener("pointerup", e => { if (down && !down.drag) at(e); down = null; });
  wrap.addEventListener("pointercancel", () => { down = null; });
  wrap.addEventListener("keydown", e => {
    const k = { ArrowLeft: -step, ArrowRight: step }[e.key];
    if (k) { e.preventDefault(); set(snap(state.d + k)); }
    else if (e.key === "Home") { e.preventDefault(); set(dLo); }
    else if (e.key === "End") { e.preventDefault(); set(snap(newest)); }
  });
}

// --------------------------------------------------------- muscle balance
// On the Body Scan tab, not Trends: it is segmental data, a difference
// between the two sides of the arm and leg panels above it, and it starts
// when they do. It covers their dates (from segD0), not the Trends window.
function renderBalance(segD0) {
  const panel = document.getElementById("p-balance");
  panel.replaceChildren();
  panel.hidden = !SER.arms && !SER.legs;
  if (panel.hidden) return;
  const B = D.balance;
  const first = Math.min(SER.arms ? SER.arms.s0 : Infinity, SER.legs ? SER.legs.s0 : Infinity);
  const sr = { d0: Math.min(first, segD0 ?? Infinity), d1: TODAY, all: true };
  const sd0 = sr.d0, d1 = sr.d1, sweekly = weeklyFor(panel, sd0, d1);
  const arms = sweekly ? WK.arms : SER.arms, legs = sweekly ? WK.legs : SER.legs;
  panelHead(panel, `Muscle balance, right − left · ${MU}`, sr);
  panel.append(h("p", "desc", "Withings segmental."));
  legend(panel, [["line withings", sweekly ? "R − L, weekly mean of first weigh-ins" : "R − L, first weigh-in of the day"],
                 ["band", "±1 SD of day-to-day change"]]);
  const charts = [];
  for (const [key, s, label] of [["arms", arms, "Arms"], ["legs", legs, "Legs"]]) {
    if (!s) continue;
    const noise = B[key] && B[key].sd_change;
    const [lo, hi] = extent([s], sd0, d1);
    const [plo, phi] = pad([Math.min(lo, noise ? -noise : 0, 0), Math.max(hi, noise || 0, 0)], 0.06);
    const c = new Chart(chartBox(panel, [label, null]), { d0: sd0, d1, height: 80, lo: plo, hi: phi, yFmt: v => fix(v, 1), label: `${label}, right minus left muscle mass, ${MU}` });
    if (noise) c.band(-noise, noise);
    c.line(s, "withings");
    c.endLabel(s, "withings", v => signed(v, 2));
    charts.push(c);
  }
  linkCharts(charts, d => ({
    title: bucketTitle(d, sweekly ? 7 : 1),
    items: [["arms", arms], ["legs", legs]].filter(x => x[1]).map(([k, s]) =>
      lineItem(s, d, "withings", `${k} R − L`, v => `${signed(v, 2)} ${MU}`, "weigh-in")),
  }), sweekly ? weekly7 : null);
  const a = B.arms, l = B.legs;
  if (a && l) {
    // dashboard.balance_stats decides whether the gap is steady; this only words it.
    const lead = a.lead && a.lead === l.lead ? a.lead : null;
    const ahead = s => lead === "left" ? s.months_negative : s.months_positive;
    const means = `R − L averages ${signed(a.mean, 2)} ${MU} for arms and ${signed(l.mean, 2)} ${MU} for legs since ${fmtMonth(dn(a.first))}`;
    const wobble = a.sd_change != null && l.sd_change != null
      ? `The band is the typical day-to-day wobble in R − L: ±${fix(a.sd_change, 2)} ${MU} (arms), ±${fix(l.sd_change, 2)} ${MU} (legs). ` : "";
    const cause = lead
      ? `What this data can't tell apart is whether the difference is in your body or is a fixed bias in how the scale's right and left electrodes read: both would look exactly like this. ` +
        "A few reversed weigh-ins would settle it: stand facing the other way and swap hands on the handle, so each foot and hand touches the opposite electrode. " +
        "If the gap is in your body, R − L flips sign; if it keeps its sign, it's the scale."
      : "Even a steady gap could be the body or a fixed bias in the scale's electrodes; reversed weigh-ins, with feet and hands on the opposite electrodes, would tell them apart.";
    panel.append(h("p", "desc", lead
      ? `The ${lead} side carries more muscle in both arms and legs. ` + means +
        `, and the ${lead} side is ahead in ${ahead(a)} of ${a.months} months (arms) and ${ahead(l)} of ${l.months} (legs). ` + wobble +
        "The gap is bigger than that wobble and points the same way every month, so it is a steady difference, not reading-to-reading noise. " + cause
      : means + ". " + wobble +
        `The right side is ahead in ${a.months_positive} of ${a.months} months (arms) and ${l.months_positive} of ${l.months} (legs), so no steady direction yet. ` + cause));
  }
}

// -------------------------------------------------------------- body scan
// dashboard.body_scan computes every number here: each region's fat, muscle
// and bone as shares of its OWN mass (dashboard.composition), the map's
// shade for each region off the fat ramp (dashboard.fat_colour), the then-and-now
// comparison and the checks on it (dashboard.fat_change), the algorithm
// changes and how far each moved a region (dashboard.algo_steps), the
// spread, and every range. This only draws them.
//
// Sections 1 to 3 use full scans only (all six regions in one weigh-in), so
// they cover the segmental era. Section 4 carries each region's own history:
// for the whole body, back past the segmental era where it has it.
//
// Only fat % is drawn over time. Fat, muscle and bone make 100% of a region
// and bone barely moves, so a muscle % line would be the fat line upside
// down. Muscle % is shown as a number wherever it is useful.
const BS = D.bodyscan;
const BSR = BS.regions.map(R => ({ ...R, s: { 1: series(R.series), 7: series(R.weekly), [BS.long_days]: series(R.long) } }));
const REG = Object.fromEntries(BSR.map(R => [R.key, R]));
const NOW = BS.latest ? Object.fromEntries(BS.latest.rows.map(r => [r.key, r])) : {};
const CHANGE_WINS = ["90d", "1y", "All"];
const BS_STATE = { region: "whole", win: CHANGE_WINS.includes(store.get("window:bodyscan")) ? store.get("window:bodyscan") : "All" };
const years = (a, b) => fix((b - a + 1) / 365.25, 1);
const lower = s => s.charAt(0).toLowerCase() + s.slice(1);
const pts = v => `${fix(v, 1)} ${Math.abs(v) === 1 ? "point" : "points"}`;
// Days per mark the width allows: one a day, a week, or 28 days.
function stepFor(width, d0, d1) {
  const ppd = width / (d1 - d0 + 1);
  return ppd >= MIN_PX_PER_DAY ? 1 : ppd * 7 >= MIN_PX_PER_DAY ? 7 : BS.long_days;
}
const stepText = step => (step === 1 ? "A day without a scan is a gap."
  : `Too many days to mark each one, so the lines are ${meansName(step)} of first weigh-ins; a stretch without one is a gap.`);

// Two colour scales on one tab, never mixed. The fat ramp shades the map
// (and the composition bars beside it) by fat %: it is read only inside
// renderMap. Everywhere else a region is a series, in its identity colour:
// one hue per body part, the lighter shade of a pair for the left side
// (the --rg-<key> tokens, one set per theme). A region keeps that colour in
// every chart, whatever its fat %.
(function regionStyles() {
  const css = BSR.map(({ key: k }) => `.ln.rg-${k}{stroke:var(--rg-${k})}` +
    `.rg-${k}:not(.ln){fill:var(--rg-${k})}i.rg-${k},.rbar.rg-${k},.cbar .fa.rg-${k}{background:var(--rg-${k});color:var(--rg-ink-${k})}`).join("");
  const st = document.createElement("style");
  st.textContent = css + ".legend i.line.rg-whole{background:repeating-linear-gradient(90deg,var(--rg-whole) 0 5px,transparent 5px 8px)}";
  document.head.append(st);
})();
const rampCss = () => `linear-gradient(to right, ${BS.ramp.anchors.map(([v, c]) => {
  const a = BS.ramp.anchors[0][0], b = BS.ramp.anchors[BS.ramp.anchors.length - 1][0];
  return `${c} ${fix((v - a) / (b - a) * 100, 1)}%`;
}).join(", ")})`;

// ------------------------------------------------- section 1: the body map
// Your right side is on the right of the figure and your left on the left,
// as you'd see your own body from behind. Labelled R and L all the same.
const FIG = {
  arm_right: { x: 148, y: 50, w: 34, h: 112, rx: 14 },
  torso: { x: 57, y: 48, w: 86, h: 110, rx: 16 },
  arm_left: { x: 18, y: 50, w: 34, h: 112, rx: 14 },
  leg_right: { x: 102, y: 162, w: 37, h: 122, rx: 15 },
  leg_left: { x: 61, y: 162, w: 37, h: 122, rx: 15 },
};
function renderMap(panel) {
  panel.replaceChildren();
  const L = BS.latest;
  if (!L) { panelHead(panel, "Body map"); panel.append(h("p", "none", "No Body Scan weigh-in with all six regions stored.")); return; }
  const d = dn(L.day);
  panelHead(panel, `Body map · latest scan · ${fmtDay(d)} ${ud(d).getUTCFullYear()}${L.time ? " · " + L.time : ""}`);
  const wrap = h("div", "bmap");
  panel.append(wrap);
  const svg = sv("svg", { width: 200, height: 304, viewBox: "0 0 200 304", class: "fig", role: "group",
    "aria-label": "Fat % of each region of the body. Select a region to show its detail." }, wrap);
  sv("circle", { cx: 100, cy: 23, r: 19, class: "fhead" }, svg);
  for (const [key, b] of Object.entries(FIG)) {
    const r = NOW[key];
    const g = sv("g", { class: "rgn" + (key === BS_STATE.region ? " sel" : ""), tabindex: 0, role: "button",
      "aria-label": `${r.label}: ${fix(r.fat_pct, 1)}% fat, ${fix(r.muscle_pct, 1)}% muscle. Show its detail.` }, svg);
    sv("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: b.rx, fill: r.colour }, g);
    sv("text", { x: b.x + b.w / 2, y: b.y + b.h / 2, fill: r.ink, "text-anchor": "middle", "dominant-baseline": "middle" }, g, fix(r.fat_pct, 1));
    const go = () => selectRegion(key, true);
    g.addEventListener("click", go);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  }
  for (const [x, t] of [[35, "L"], [165, "R"], [79, "L"], [120, "R"]]) {
    sv("text", { x, y: x === 35 || x === 165 ? 175 : 298, class: "fside", "text-anchor": "middle" }, svg, t);
  }
  const side = h("div", "mside");
  const hi = NOW[L.spread.hi], lo = NOW[L.spread.lo];
  const wb = h("p", "mwhole");
  wb.append(h("span", "msw"), "Whole body ");
  wb.firstChild.style.background = NOW.whole.colour;
  wb.append(h("b", "num", `${fix(NOW.whole.fat_pct, 1)}%`), " fat");
  side.append(h("p", "mlab", "Fat % of each region's own mass"));
  const bar = h("div", "rampbar");
  bar.style.background = rampCss();
  const A = BS.ramp.anchors;
  const lab = h("div", "ramplab");
  lab.append(h("span", null, `${A[0][0]}%`), h("span", null, "darker = more fat"), h("span", null, `${A[A.length - 1][0]}%`));
  side.append(bar, lab, h("p", "mnote", "Beyond either end, the end colour. R and L are your right and left."), wb);
  side.append(h("p", "msent", `Your ${lower(hi.label)} carries ${pts(L.spread.points)} more fat than your ${lower(lo.label)}.`));
  wrap.append(side);

  // One stacked bar per region: fat, muscle and bone as shares of the
  // region's own mass, with that mass at the right.
  const grid = h("div", "cbars");
  for (const t of ["", "fat", "muscle, % of the region", "bone*", MU]) grid.append(h("span", "cbh", t));
  for (const r of L.rows) {
    const nm = h("span", "nm" + (r.key === "whole" ? " wh" : ""), r.label);
    const cb = h("div", "cbar");
    cb.setAttribute("role", "img");
    cb.setAttribute("aria-label", `${r.label}: ${fix(r.fat_pct, 1)}% fat, ${fix(r.muscle_pct, 1)}% muscle, ${fix(r.bone_pct, 1)}% bone (derived), of ${fix(r.mass, 1)} ${MU}`);
    for (const [cls, v, txt] of [["fa", r.fat_pct, ""], ["mu", r.muscle_pct, fix(r.muscle_pct, 1)], ["bo", r.bone_pct, ""]]) {
      const seg = h("span", cls, txt);
      seg.style.flex = `${v} 0 0`;
      if (cls === "fa") { seg.style.background = r.colour; seg.style.color = r.ink; }
      cb.append(seg);
    }
    grid.append(nm, h("span", "fp", fix(r.fat_pct, 1)), cb, h("span", "bn", fix(r.bone_pct, 1)), h("span", "ms", fix(r.mass, 1)));
  }
  panel.append(grid);
  const now = BS.change && BS.change.All ? BS.change.All.ends.filter(e => e.end === "now") : [];
  if (now.length) {
    panel.append(h("p", "desc", `This scan reads well under the ${now[0].n} before it for ` +
      listText(now.map(e => `the ${lower(e.label)} (${fix(e.value, 1)}% against a median of ${fix(e.median, 1)}%)`)) +
      ". One scan can be off; What changed below shows it against the first."));
  }
  panel.append(h("p", "desc", "Each percentage is a share of that region's own mass, its fat-free plus fat mass. " +
    "For the whole body that is the weight." +
    (L.weight != null ? ` The five segments add up to ${fix(L.segments_mass, 1)} ${MU}; the scale weighed ${fix(L.weight, 1)} ${MU}.` : "")));
  panel.append(h("p", "desc", "* Bone is derived, not measured. Withings reports bone mass for the whole body only, " +
    "so each region's bone is its fat-free mass minus its muscle mass." +
    (L.bone_measured != null ? ` For the whole body that gives ${fix(NOW.whole.bone, 2)} ${MU}, and Withings' own bone mass is ${fix(L.bone_measured, 2)} ${MU}.` : "")));
}
const listText = a => (a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]);

// ---------------------------------------------- section 2: what changed
function renderChange(panel) {
  panel.replaceChildren();
  const ph = h("div", "ph");
  ph.append(h("h2", null, "What changed · fat %"));
  const ctl = h("div", "win inwin");
  ctl.setAttribute("role", "group");
  ctl.setAttribute("aria-label", "What 'then' means");
  for (const k of CHANGE_WINS) {
    const b = h("button", null, k);
    b.type = "button";
    b.setAttribute("aria-pressed", String(k === BS_STATE.win));
    b.addEventListener("click", () => { BS_STATE.win = k; store.set("window:bodyscan", k); renderChange(panel); });
    ctl.append(b);
  }
  ph.append(ctl);
  panel.append(ph);
  const C = BS.change && BS.change[BS_STATE.win];
  if (!C) { panel.append(h("p", "none", "Fewer than two full scans in this window.")); return; }
  const t0 = dn(C.then), t1 = dn(C.now);
  panel.append(h("p", "desc", `Two actual scans, not a fitted trend: the first full scan in the window, ${fmtDate(t0)}, ` +
    `and the latest, ${fmtDate(t1)} (${plural(C.scans, "scan day")} in between, counting both). ` +
    "Two points means a bad reading at either end shows here instead of being smoothed away."));
  // The region colours' key, the first on the tab, and the one place the
  // side rule is said: the charts below use the same colours.
  const key = legend(panel, BSR.map(R => [`line rg-${R.key}`, R.short]));
  key.append(h("span", "lrule", "Arms and legs: lighter is left, darker is right"));
  const marked = new Set(C.algo.flatMap(a => Object.keys(a.steps)));
  slopeChart(panel, C, t0, t1);
  panel.append(h("p", "ct", "Points of fat lost, then to now"));
  rankBars(panel, C, marked);
  if (C.algo.length) {
    for (const a of C.algo) {
      const st = Object.entries(a.steps).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
      panel.append(h("p", "desc", `† Withings changed its body-composition algorithm on ${fmtDate(dn(a.day))}, between these two scans. ` +
        `That day fat % moved with no change in you: ${listText(st.map(([k, v]) => `${REG[k].short} ${signed(v, 1)}`))} points ` +
        "(the median of the 7 scans after it against the 7 before). So the change shown for those regions isn't like for like."));
    }
  }
  const quiet = C.algo_all - C.algo.length;
  if (quiet > 0) panel.append(h("p", "desc", `${quiet === 1 ? "One other algorithm change" : `${quiet} other algorithm changes`} in this window moved every region by under a point.`));
  const byEnd = {};
  for (const e of C.ends) (byEnd[e.end] = byEnd[e.end] || []).push(e);
  for (const end of ["then", "now"]) {
    const E = byEnd[end];
    if (!E) continue;
    panel.append(h("p", "desc", `Check the ${end === "then" ? "first" : "latest"} scan: on ${fmtDate(dn(E[0].day))} ` +
      listText(E.map(e => `the ${lower(e.label)} read ${fix(e.value, 1)}% against a median of ${fix(e.median, 1)}%`)) +
      ` over the ${E[0].n} scans ${end === "then" ? "after" : "before"} it.`));
  }
}

function slopeChart(panel, C, t0, t1) {
  const box = h("div", "chart");
  panel.append(box);
  const W = Math.max(280, box.clientWidth), H = 230, top = 26, bot = 12;
  const xa = 58, xb = W - 104;
  const vals = C.rows.flatMap(r => [r.then, r.now]);
  const [lo, hi] = pad([Math.min(...vals), Math.max(...vals)], 0.04);
  const y = v => top + (hi - v) / (hi - lo) * (H - top - bot);
  const svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `Fat % by region on ${fmtDate(t0)} and ${fmtDate(t1)}: ` + C.rows.map(r => `${r.label} ${fix(r.then, 1)} to ${fix(r.now, 1)}`).join(", ") }, box);
  sv("text", { x: xa, y: 11, class: "tick", "text-anchor": "middle" }, svg, fmtDate(t0));
  sv("text", { x: xb, y: 11, class: "tick", "text-anchor": "middle" }, svg, fmtDate(t1));
  for (const x of [xa, xb]) sv("line", { x1: x, x2: x, y1: top - 6, y2: H - bot + 4, class: "grid" }, svg);
  const order = BSR.map(R => R.key);
  const rows = [...C.rows].sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  for (const r of rows) {
    sv("line", { x1: xa, x2: xb, y1: y(r.then), y2: y(r.now), class: "ln rg-" + r.key + (r.key === "whole" ? " dash" : "") }, svg);
    for (const [x, v] of [[xa, r.then], [xb, r.now]]) sv("circle", { cx: x, cy: y(v), r: 3.5, class: "end rg-" + r.key }, svg);
  }
  // Labels at both ends, nudged apart where values sit close together.
  const place = (items) => {
    items.sort((a, b) => a.y - b.y);
    for (let i = 1; i < items.length; i++) items[i].y = Math.max(items[i].y, items[i - 1].y + 13);
    const over = items.length ? items[items.length - 1].y - (H - 4) : 0;
    if (over > 0) for (const it of items) it.y -= over;
    for (let i = items.length - 2; i >= 0; i--) items[i].y = Math.min(items[i].y, items[i + 1].y - 13);
    return items;
  };
  for (const it of place(rows.map(r => ({ y: y(r.then), r })))) {
    sv("text", { x: xa - 9, y: it.y, class: "slab", "text-anchor": "end", "dominant-baseline": "middle" }, svg, fix(it.r.then, 1));
  }
  for (const it of place(rows.map(r => ({ y: y(r.now), r })))) {
    const t = sv("text", { x: xb + 9, y: it.y, class: "slab", "dominant-baseline": "middle" }, svg);
    t.append(document.createTextNode(fix(it.r.now, 1) + " "));
    sv("tspan", { class: "slabn" }, t, REG[it.r.key].short);
  }
}

function rankBars(panel, C, marked) {
  const g = h("div", "rank");
  const lo = Math.min(0, ...C.rows.map(r => r.lost)), hi = Math.max(0, ...C.rows.map(r => r.lost));
  const span = (hi - lo) || 1, z = (0 - lo) / span * 100;
  for (const r of C.rows) {
    g.append(h("span", "nm", REG[r.key].short + (marked.has(r.key) ? " †" : "")));
    const trk = h("span", "rtrk"), bar = h("span", "rbar rg-" + r.key);
    const a = Math.min(0, r.lost), b = Math.max(0, r.lost);
    bar.style.left = `${(a - lo) / span * 100}%`;
    bar.style.width = `${(b - a) / span * 100}%`;
    if (lo < 0) { const zl = h("span", "rzero"); zl.style.left = `${z}%`; trk.append(zl); }
    trk.append(bar);
    g.append(trk, h("span", "rv", r.lost < 0 ? `gained ${fix(-r.lost, 1)}` : fix(r.lost, 1)));
  }
  panel.append(g);
}

// ------------------------------------------- section 3: one shared axis
function renderCompare(panel, d0) {
  panel.replaceChildren();
  if (!BS.latest || d0 == null) { panel.hidden = true; return; }
  panel.hidden = false;
  const d1 = TODAY;
  panelHead(panel, "All regions on one axis · fat %", { d0, d1, all: true });
  const desc = h("p", "desc");
  panel.append(desc);
  const order = [...BS.latest.rows].sort((a, b) => b.fat_pct - a.fat_pct);
  legend(panel, order.map(r => [`line rg-${r.key}`, `${r.short} ${fix(r.fat_pct, 1)}`]));
  const box = chartBox(panel, null);
  const step = stepFor(plotWidth(box), d0, d1);
  const [b1, b2] = BS.bone_range;
  desc.textContent = `Every region's fat % on one scale, so a torso can be set against an arm. Whole body dashed; legend values are the latest scan, ${fmtDate(dn(BS.latest.day))}. ` +
    `Only fat % is drawn: fat, muscle and bone make 100% of each region and bone stays between ${fix(b1, 1)} and ${fix(b2, 1)}%, ` +
    "so a muscle % line would be this one upside down. Muscle % is a number on the map and in the region detail. " +
    "Dashed verticals are Withings algorithm changes. " + stepText(step);
  const ax = BS.shared_axis;
  const c = new Chart(box, { d0, d1, height: 190, lo: ax.lo, hi: ax.hi, exact: true, clip: true,
    yFmt: v => String(v), label: `Fat % of each region, ${fmtDate(d0)} to ${fmtDate(d1)}, one shared scale` });
  for (const a of BS.algo) c.mark(dn(a.day));
  for (const R of [...BSR].reverse()) c.line(R.s[step], `rg-${R.key}${R.key === "whole" ? " dash" : ""}`);
  c.axisBreak();
  // The spread: fattest minus leanest segment, on its own scale.
  const S = BS.spread, ss = series(step === 1 ? S.series : step === 7 ? S.weekly : S.long, step);
  panel.append(h("p", "ct", "Spread · fattest minus leanest segment, points"));
  const sbox = h("div", "chart");
  panel.append(sbox);
  const sc = new Chart(sbox, { d0, d1, height: 70, lo: S.axis.lo, hi: S.axis.hi, ends: true, clip: true,
    yFmt: v => String(v), label: "Spread between the fattest and leanest segment, points" });
  for (const a of BS.algo) sc.mark(dn(a.day));
  sc.line(ss, "sp");
  sc.axisBreak();
  const big = BS.algo.find(a => (Math.abs(a.steps.leg_left || 0) >= 1 || Math.abs(a.steps.leg_right || 0) >= 1));
  panel.append(h("p", "desc", `${fix(S.first, 1)} points on ${fmtDate(d0)}, ${fix(S.last, 1)} on ${fmtDate(dn(BS.latest.day))}. ` +
    "Narrowing means the fattest region is losing fat faster than the leanest: fat is coming off unevenly." +
    (big ? ` Part of the drop on ${fmtDate(dn(big.day))} is the algorithm change, which put the legs' fat about ${fix(Math.max(big.steps.leg_left || 0, big.steps.leg_right || 0), 1)} points higher overnight.` : "")));
  linkCharts([c, sc], d => ({
    title: bucketTitle(d, step),
    items: [...BSR.map(R => lineItem(R.s[step], d, `line rg-${R.key}`, R.short, v => `${fix(v, 1)}%`, "weigh-in")),
            lineItem(ss, d, null, "spread", v => fix(v, 1), "weigh-in")],
  }), step === 1 ? null : { step, snap: n => bucketStart(n, step) });
}

// ---------------------------------------------- section 4: region detail
function selectRegion(key, jump) {
  BS_STATE.region = key;
  renderDetail(document.getElementById("p-detail"));
  for (const g of document.querySelectorAll("#p-map .rgn")) g.classList.remove("sel");
  const keys = Object.keys(FIG), i = keys.indexOf(key);
  if (i >= 0) document.querySelectorAll("#p-map .rgn")[i].classList.add("sel");
  if (jump) document.getElementById("p-detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderDetail(panel) {
  panel.replaceChildren();
  if (!BS.latest) { panel.hidden = true; return; }
  panel.hidden = false;
  const key = BS_STATE.region, R = REG[key], r = NOW[key], since = BS.since[key];
  panelHead(panel, "Region detail");
  const seg = h("div", "seg");
  seg.setAttribute("role", "group");
  seg.setAttribute("aria-label", "Region");
  for (const x of BS.latest.rows) {
    const b = h("button", null, x.short);
    b.type = "button";
    b.setAttribute("aria-pressed", String(x.key === key));
    b.addEventListener("click", () => selectRegion(x.key, false));
    seg.append(b);
  }
  panel.append(seg);
  const nd = dn(BS.latest.day);
  const hl = h("div", "hl");
  for (const [m, name] of [["fat_pct", "Fat"], ["muscle_pct", "Muscle"]]) {
    const S = since[m], cell = h("div");
    cell.append(h("p", "hlab", `${name} · ${fmtDate(nd)}`), h("p", "hbig", `${fix(r[m], 1)}%`));
    if (S.change != null) cell.append(h("p", "chg", `${signed(S.change, 1)} points since ${fmtDate(dn(S.day))}`));
    hl.append(cell);
  }
  panel.append(hl);
  // The composition in the display unit: fat, muscle, bone of this region.
  // Its fat is in the region's identity colour, like its line and its dot
  // below: off the map, a ramp shade would read as a region's colour.
  const cb = h("div", "cbar big");
  cb.setAttribute("role", "img");
  cb.setAttribute("aria-label", `${r.label}: ${fix(r.fat, 1)} ${MU} fat, ${fix(r.muscle, 1)} ${MU} muscle, ${fix(r.bone, 2)} ${MU} bone (derived)`);
  for (const [cls, v] of [["fa", r.fat], ["mu", r.muscle], ["bo", r.bone]]) {
    const s = h("span", cls === "fa" ? `fa rg-${key}` : cls, cls === "bo" ? "" : `${fix(v, 1)}`);
    s.style.flex = `${v} 0 0`;
    cb.append(s);
  }
  panel.append(cb);
  panel.append(h("p", "cbl", `fat ${fix(r.fat, 1)} · muscle ${fix(r.muscle, 1)} · bone* ${fix(r.bone, 2)} · of ${fix(r.mass, 1)} ${MU}`));

  // Its fat % history, on its own scale. The whole body's can start years earlier.
  const d0 = R.first.fat_pct ? dn(R.first.fat_pct) : null, d1 = TODAY;
  if (d0 != null && R.axis) {
    const segFrom = BS.era ? dn(BS.era) : null;
    panel.append(h("p", "ct", `Fat % since ${fmtDate(d0)} · ${years(d0, d1)} years`));
    const box = h("div", "chart");
    panel.append(box);
    const step = stepFor(plotWidth(box), d0, d1);
    const S = R.s[step];
    const c = new Chart(box, { d0, d1, height: 110, lo: R.axis.lo, hi: R.axis.hi, ends: true, clip: true,
      yFmt: v => String(v), label: `${r.label}, fat % over time` });
    const marks = key === "whole" ? BS.algo_whole : BS.algo;
    for (const a of marks) c.mark(dn(a.day));
    c.line(S, `rg-${key}`);
    c.axisBreak();
    linkCharts([c], d => ({ title: bucketTitle(d, step),
      items: [lineItem(S, d, `line rg-${key}`, `${r.short} fat`, v => `${fix(v, 1)}%`, "weigh-in")] }),
      step === 1 ? null : { step, snap: n => bucketStart(n, step) });
    const moved = marks.filter(a => Math.abs(a.steps[key] || 0) >= 1);
    panel.append(h("p", "desc", (key === "whole"
      ? `The longest history on the page: fat % from ${fmtDate(d0)}, muscle % from ${fmtDate(dn(since.muscle_pct.day))}. ` +
        (segFrom != null ? `The segments can't go back that far: segmental readings start ${fmtDate(segFrom)}, so the other sections cover ${years(segFrom, d1)} years. ` : "")
      : `Segmental readings start ${fmtDate(d0)}; for the long history, pick Whole. `) +
      "Dashed verticals are Withings algorithm or scale changes" +
      (moved.length ? `; the one on ${listText(moved.map(a => fmtDate(dn(a.day))))} moved this region's fat % ${listText(moved.map(a => signed(a.steps[key], 1)))} points overnight, so the change since the first scan isn't like for like. `
                    : ", none of which moved this region's fat % by a point or more. ") +
      "Muscle % is a number here, not a line: it mirrors fat %. " + stepText(step)));
  }
  dotPlot(panel, key);
}

// Where the region sits against the other five today.
function dotPlot(panel, key) {
  const rows = BS.latest.rows;
  panel.append(h("p", "ct", `Against the other regions · ${fmtDate(dn(BS.latest.day))}`));
  const box = h("div", "chart");
  panel.append(box);
  const W = Math.max(280, box.clientWidth), H = 74, l = 26, rr = 26, yAx = 40;
  const v = rows.map(x => x.fat_pct);
  const lo = Math.floor(Math.min(...v) - 1), hi = Math.ceil(Math.max(...v) + 1);
  const x = t => l + (t - lo) / (hi - lo) * (W - l - rr);
  const svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Fat % of all six regions on the latest scan: " + rows.map(r => `${r.label} ${fix(r.fat_pct, 1)}`).join(", ") }, box);
  sv("line", { x1: l, x2: W - rr, y1: yAx, y2: yAx, class: "base" }, svg);
  sv("text", { x: l, y: yAx + 26, class: "tick", "text-anchor": "middle" }, svg, `${lo}%`);
  sv("text", { x: W - rr, y: yAx + 26, class: "tick", "text-anchor": "middle" }, svg, `${hi}%`);
  const others = rows.filter(r => r.key !== key).sort((a, b) => a.fat_pct - b.fat_pct);
  others.forEach((r, i) => {
    sv("circle", { cx: x(r.fat_pct), cy: yAx, r: 4.5, class: "end rg-" + r.key }, svg);
    sv("text", { x: x(r.fat_pct), y: i % 2 ? yAx + 15 : yAx - 9, class: "dlab", "text-anchor": "middle" }, svg, r.short);
  });
  const me = rows.find(r => r.key === key);
  sv("circle", { cx: x(me.fat_pct), cy: yAx, r: 7.5, class: "dme rg-" + key }, svg);
  sv("text", { x: x(me.fat_pct), y: 10, class: "dmel", "text-anchor": "middle" }, svg, `${me.short} ${fix(me.fat_pct, 1)}%`);
}

function renderBodyScan() {
  renderMap(document.getElementById("p-map"));
  renderChange(document.getElementById("p-change"));
  const d0 = BS.era ? dn(BS.era) : null;
  renderCompare(document.getElementById("p-compare"), d0);
  renderDetail(document.getElementById("p-detail"));
  renderBalance(d0);
}

// ----------------------------------------------------------------- tonal
// dashboard.movement_history computes every number here: the working load
// (median of the day's working sets, warm-ups and weightless sets left out,
// doubled where both arms pull together), which points are joined, each
// quarter's median and where it sits in its row's range, and the machine's
// ceiling. This only draws them. The detail chart is scaled to its own
// movement's history (dashboard.load_axis), so an axis that doesn't start
// at zero is marked broken and labels where it starts.
const TN = D.tonal;
// Starts on the routine done most recently, every time the page opens.
let ROUTINE = 0;
// The movement in the detail chart; null means the routine's first.
let PROMOTED = null;
const routineName = t => (t == null ? "Untitled" : t);
const moveName = M => M.name || `Unknown movement ${M.short}`;

function renderTonal() {
  const panel = document.getElementById("p-tonal");
  panel.replaceChildren();
  if (!TN || !TN.routines.length) { panelHead(panel, "Tonal"); panel.append(h("p", "none", "No Tonal sets stored.")); return; }
  const R = TN.routines[ROUTINE];

  const pick = h("div", "pick");
  const lab = h("label", null, "Routine");
  lab.htmlFor = "routine";
  const sel = h("select");
  sel.id = "routine";
  TN.routines.forEach((r, i) => {
    const o = h("option", null, `${routineName(r.title)} · ${fmtDate(dn(r.last))}`);
    o.value = String(i);
    sel.append(o);
  });
  sel.value = String(ROUTINE);
  sel.addEventListener("change", () => {
    ROUTINE = +sel.value;
    PROMOTED = null;
    document.getElementById("tip").hidden = true;
    renderTonal();
    document.getElementById("routine").focus();
  });
  pick.append(lab, sel);
  panel.append(pick);

  const charted = R.movements.map(id => [id, TN.movements[id]]).filter(([, m]) => m.weighted);
  const weightless = R.movements.map(id => TN.movements[id]).filter(m => !m.weighted);
  panel.append(h("p", "desc",
    `Newest session ${fmtDay(dn(R.last))} ${ud(dn(R.last)).getUTCFullYear()}: ${plural(R.movements.length, "movement")}. ` +
    (charted.length > 1 ? "Tap a row in the matrix to chart that movement here. " : "") +
    "The window sets the chart's dates; the matrix is always the whole history."));
  if (!charted.length) panel.append(h("p", "none", "No movement in this session has a weight recorded."));
  else {
    // dashboard.movement_history picks the default: the longest history.
    if (!charted.some(([id]) => id === PROMOTED)) PROMOTED = R.promote || charted[0][0];
    const detail = h("div", "mv");
    panel.append(detail);
    drawDetail(detail, PROMOTED);
    loadMatrix(panel, R, charted, detail);
  }

  if (weightless.length) {
    const p = h("p", "nowt");
    p.append(h("b", null, "No weight recorded: "),
      weightless.map(m => m.name || `unknown movement ${m.short}`).join(", ") +
      ". Bodyweight or off-machine, so there is no load to plot.");
    panel.append(p);
  }
  panel.append(h("p", "desc",
    `Total load (${MU}) is the median weight of the day's sets, leaving out warm-ups and sets with no weight. ` +
    "Where both of Tonal's arms pull at once (bars, two-handle moves), both arms are added together, " +
    "so those read double the per-arm weight the Tonal screen shows. " +
    "The chart is scaled to its movement's history. Where its axis doesn't start at zero, it has a break mark " +
    "and says where it starts, because a cut-off axis makes a small gain look large."));
}

// One movement's whole history, one point per day it was done.
function drawDetail(box, id) {
  box.replaceChildren();
  const M = TN.movements[id], name = moveName(M);
  const r = range(dn(M.pts[0][0]), "tonal"), { d0, d1 } = r;
  const since = `${plural(M.sessions, "day")}, first ${fmtMonth(dn(M.first))}`;
  // Keyed on the arms flag, not the name: a movement named by hand without
  // arms_together is just as undoubled as an unnamed one.
  const sub = `total load (${MU}) · ${since} · ${rangeText(r)}` +
    (M.name ? "" : ` · in ${M.titles.map(routineName).join(", ")}`) +
    (M.arms == null ? " · whether both arms pull is unknown: plotted as recorded, not doubled" : "");
  const host = chartBox(box, [name, sub]);
  const c = new Chart(host,
    { d0, d1, height: 130, lo: M.y[0], hi: M.y[1], integer: true, exact: true, label: `${name}, total load, ${MU}` });
  if (c.axisBreak()) {
    const note = ` · axis starts at ${thou(c.lo)} ${MU}, not 0`;
    host.previousSibling.append(h("span", "lo", note));
    c.svg.setAttribute("aria-label", c.svg.getAttribute("aria-label") + note);
  }
  for (const a of spansFor(["tonal"], d0, d1)) c.span(a.a, a.b, null);
  // Tonal's 100 lb-per-arm ceiling, drawn once the movement comes near it
  // (dashboard.CAP_NEAR): a line that flattens here is the machine's limit.
  if (M.cap != null && M.cap <= c.hi) {
    const y = Math.round(c.y(M.cap)) + 0.5;
    sv("line", { x1: c.m.l, x2: c.m.l + c.pw, y1: y, y2: y, class: "capl" }, c.gBack);
    sv("text", { x: c.m.l + 4, y: y - 4, class: "capt" }, c.gTop,
      `Tonal max ${thou(M.cap)}${M.arms === 1 ? ", both arms" : ""}`);
  }
  const shown = c.sessions(M.pts, "tonal", 3);
  if (!shown.length) {
    sv("text", { x: c.m.l + 6, y: c.m.t + 14, class: "tick" }, c.gTop, "not done in this window");
    return;
  }
  const last = c.sparse.get(shown[shown.length - 1]);
  sv("circle", { cx: c.xb(shown[shown.length - 1], 1), cy: c.y(last[1]), r: 4.5, class: "end tonal" }, c.gTop);
  sv("text", { x: c.m.l + c.pw + 7, y: c.y(last[1]), class: "endlab", "dominant-baseline": "middle" }, c.gTop, thou(last[1]));
  // The pointer snaps to the nearest day the movement was done.
  const near = d => shown.reduce((a, b) => (Math.abs(b - d) < Math.abs(a - d) ? b : a));
  const move = (cur, dir) => {
    const i = shown.indexOf(cur);
    return shown[Math.max(0, Math.min(shown.length - 1, (i < 0 ? shown.length - 1 : i) + dir))];
  };
  linkCharts([c], d => {
    const p = c.sparse.get(d);
    const items = [{ cls: "tonal", value: `${fix(p[1], 1)} ${MU}`, label: "total load" }];
    if (M.arms === 1) items.push({ value: `${fix(p[1] / 2, 1)} ${MU}`, label: "per arm, as Tonal shows it" });
    items.push({ value: String(p[2]), label: `working set${p[2] === 1 ? "" : "s"}, median` },
               { value: "", label: routineName(TN.titles[p[4]]) });
    return { title: `${fmtDay(d)} ${ud(d).getUTCFullYear()}`, items };
  }, { snap: near, move });
}

// Quarters as integers, so every row shares one set of columns.
const qIndex = s => +s.slice(0, 4) * 4 + Math.floor((+s.slice(5, 7) - 1) / 3);
const qLabel = q => `Q${q % 4 + 1} ${Math.floor(q / 4)}`;
const QSTEPS = 5;

// One row per weighted movement in the routine, one column per quarter. A
// cell's shade is that quarter's median load within ITS ROW's range, so
// shades compare quarters of one movement, never two movements. A quarter
// the movement wasn't done is an outline with no fill: a different kind of
// mark from any shade, so "didn't do it" can't be read as "light weight".
function loadMatrix(panel, R, charted, detail) {
  const box = h("div", "mx");
  panel.append(box);
  const t = h("p", "ct");
  t.append(h("b", null, "Load by quarter"), " · median working load, each movement's whole history");
  box.append(t);

  const lg = h("div", "mxlg");
  const ramp = h("span", "ramp");
  for (let k = 0; k < QSTEPS; k++) ramp.append(h("i", `q${k}`));
  const rl = h("span");
  rl.append(ramp, "lower → higher, within its row");
  const el = h("span");
  el.append(h("i", "qe"), "not done that quarter");
  lg.append(rl, el);
  const anyNowt = charted.some(([, M]) => M.quarters.cells.some(c => c[0] == null && c[1] > 0));
  if (anyNowt) { const nl = h("span"); nl.append(h("i", "qe qn"), "done, no weight recorded"); lg.append(nl); }
  box.append(lg);
  box.append(h("p", "desc",
    "Each row is scaled to its own range, so a shade compares one quarter with another for that movement only: " +
    "a bright cell in one row and a dim cell in another say nothing about which movement is heavier. " +
    `A row starts at the movement's first quarter. Right: the load on its newest day with a weight, ${fmtDay(dn(R.last))} unless dated.`));

  const q0 = Math.min(...charted.map(([, M]) => qIndex(M.quarters.start)));
  const q1 = Math.max(...charted.map(([, M]) => qIndex(M.quarters.start) + M.quarters.cells.length - 1));
  const n = q1 - q0 + 1;

  const grid = h("div", "mxg");
  box.append(grid);
  const years = h("div", "mxr mxy");
  years.setAttribute("aria-hidden", "true");
  const yHost = h("span", "cells");
  years.append(h("span"), yHost, h("span"));
  grid.append(years);

  const rows = [];
  for (const [id, M] of charted) {
    const row = h("button", "mxr");
    row.type = "button";
    row.dataset.id = id;
    const cur = M.current, curDay = cur ? dn(cur[0]) : null;
    const val = h("span", "mxv");
    val.append(h("span", "num", cur ? thou(cur[1]) : "—"));
    if (cur && cur[0] !== R.last) val.append(h("span", "qd", fmtDay(curDay).slice(4)));
    const cells = h("span", "cells");
    row.append(h("span", "mxl", moveName(M)), cells, val);
    const [lo, hi] = M.quarters.range;
    row.setAttribute("aria-label", `${moveName(M)}: quarterly median ${thou(lo)} to ${thou(hi)} ${MU}. ` +
      (cur ? `Newest ${thou(cur[1])} ${MU} on ${fmtDate(curDay)}. ` : "") + "Chart it above.");
    row.addEventListener("click", () => {
      if (PROMOTED === id) return;
      PROMOTED = id;
      document.getElementById("tip").hidden = true;
      for (const x of rows) x.row.setAttribute("aria-pressed", String(x.row.dataset.id === id));
      drawDetail(detail, id);
      // On a phone the chart may be scrolled off above the tapped row.
      if (detail.getBoundingClientRect().top < 0) detail.scrollIntoView({ block: "start", behavior: "smooth" });
    });
    row.setAttribute("aria-pressed", String(id === PROMOTED));
    grid.append(row);
    rows.push({ row, cells, M });
  }

  // Cells are drawn once the rows are laid out, at the width they got.
  const W = Math.max(40, rows[0].cells.clientWidth), gap = W / n > 6 ? 2 : 1;
  const cw = (W - gap * (n - 1)) / n, CH = 14, X = j => j * (cw + gap);
  for (const { cells, M } of rows) {
    const svg = sv("svg", { width: W, height: CH, viewBox: `0 0 ${W} ${CH}`, "aria-hidden": "true" }, cells);
    const off = qIndex(M.quarters.start) - q0;
    M.quarters.cells.forEach(([med, days, level], k) => {
      const j = off + k, g = sv("g", {}, svg);
      sv("title", {}, g, `${qLabel(q0 + j)}: ` + (med != null
        ? `median ${fix(med, 1)} ${MU} over ${plural(days, "day")}`
        : days ? `done on ${plural(days, "day")}, no weight recorded` : "not done"));
      if (med != null) {
        sv("rect", { x: X(j), y: 0, width: cw, height: CH, rx: Math.min(2, cw / 3),
                     class: `qc q${Math.min(QSTEPS - 1, Math.floor(level * QSTEPS))}` }, g);
      } else {
        // An outline, inset so its stroke stays inside the cell.
        sv("rect", { x: X(j) + 0.5, y: 0.5, width: Math.max(0, cw - 1), height: CH - 1,
                     rx: Math.min(2, cw / 3), class: "qe" }, g);
        if (days) sv("circle", { cx: X(j) + cw / 2, cy: CH / 2, r: 1.5, class: "qn" }, g);
      }
    });
  }
  // Year labels over the first quarter of each year, thinned to fit.
  const ysvg = sv("svg", { width: W, height: 12, viewBox: `0 0 ${W} 12` }, yHost);
  const every = Math.max(1, Math.ceil(30 / (4 * (cw + gap))));
  const firstQ1 = (4 - q0 % 4) % 4;
  for (let j = 0; j < n; j++) {
    const q = q0 + j, y = Math.floor(q / 4);
    // A history that starts mid-year gets its first year too, if it fits.
    const lead = j === 0 && q % 4 !== 0 && every === 1 && X(firstQ1) - X(0) >= 30;
    if (!lead && (q % 4 !== 0 || y % every)) continue;
    if (X(j) + 26 > W) continue;
    sv("text", { x: X(j), y: 9, class: "tick" }, ysvg, String(y));
  }
}

// ------------------------------------------------------------------ views
const VIEWS = ["today", "trends", "tonal", "bodyscan"];
const DRAW = {
  trends: renderLanes,
  tonal: renderTonal,
  bodyscan: renderBodyScan,
};
// Charts are sized to the page, so a view is redrawn when shown at a new width.
const drawnAt = {};
const mainWidth = () => document.querySelector("main").clientWidth;
let VIEW = "today";
function setView(v) {
  VIEW = v;
  for (const k of VIEWS) document.getElementById("view-" + k).hidden = k !== v;
  const win = document.getElementById("win");
  // Body Scan has no window: each card shows all of its own history.
  win.hidden = !WIN_KEY[v];
  if (WIN_KEY[v]) renderWindowControl(v);
  for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-pressed", String(b.dataset.view === v));
  document.getElementById("tip").hidden = true;
  if (DRAW[v] && drawnAt[v] !== mainWidth()) DRAW[v]();
}
for (const b of document.querySelectorAll("nav.tabs button")) {
  b.addEventListener("click", () => {
    history.replaceState(null, "", b.dataset.view === "today" ? "#" : "#" + b.dataset.view);
    setView(b.dataset.view);
  });
}
// The window buttons redraw the view they belong to.
for (const v in DRAW) { const f = DRAW[v]; DRAW[v] = () => { f(); drawnAt[v] = mainWidth(); }; }
let timer = null;
window.addEventListener("resize", () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (DRAW[VIEW] && drawnAt[VIEW] !== mainWidth()) DRAW[VIEW]();
  }, 150);
});

// Each tab has a link (#trends, #tonal, #bodyscan; plain # is Today), and
// changing it on an open page changes the tab.
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  setView(VIEWS.includes(v) ? v : "today");
});
renderHeader();
renderToday();
const fromHash = location.hash.slice(1);
setView(VIEWS.includes(fromHash) && fromHash !== "today" ? fromHash : "today");
})();
</script>
</body>
